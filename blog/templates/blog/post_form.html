{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="form-card">
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">{{ button_text }}</button>
    </form>
</section>
{% endblock %}
