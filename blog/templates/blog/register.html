{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Create Account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Ke account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</section>
{% endblock %}
