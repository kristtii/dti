{% extends "base.html" %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<section class="form-card danger-box">
    <h1>Delete Post</h1>

    <p>Are you sure you want to delete this post?</p>
    <h3>{{ post.title }}</h3>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger">Yes, delete</button>
        <a href="{% url 'post_detail' post.slug %}">Cancel</a>
    </form>
</section>
{% endblock %}
